# ---------------------------------------------------------------------------
# Faceless YouTube automation — main configuration.
# Secrets never live here; they come from environment variables / GitHub Secrets.
# ---------------------------------------------------------------------------

# documentary -> narration over atmospheric B-roll, clips looped to keep cost down
# kids        -> animated stories from a fixed character, every shot generated once
content_mode: "kids"

# The editorial queue. Production works through it in order and only invents a
# topic once it is exhausted. Empty the path to always invent.
content_plan: "content/episodes.yaml"

channel:
  name: "Benny and Friends"
  # documentary mode only — the subject area topics are drawn from.
  niche: ""
  # kids mode: the fixed cast.
  #
  # Shot prompts must NEVER describe how these characters look — the reference
  # images in assets/characters fix that, and a prompt that re-describes them
  # fights the reference and produces drift. This text exists so the writer
  # knows who they ARE: personality, relationships, what each one is for in a
  # story. Appearance lives in the pictures, character lives here.
  characters: >-
    Benny is an energetic boy who notices things first and says so loudly. He
    leads, sometimes before thinking.
    Lila is thoughtful and asks the question everyone else missed. She works
    problems out slowly and is usually right.
    Milo is a golden puppy: playful, clumsy, no words. He causes the small
    accident that starts a story, and is forgiven immediately.
    Pip is a friendly little robot who loves learning. Numbers, counting and
    naming things are his. He is delighted by facts.
    Luna is musical and expressive. Rhythm, singing, dancing and drawing belong
    to her, and she cheers everyone else on.
    Bobo is a small purple monster, mischievous and warm. He hides things and
    makes silly mistakes, never mean ones.
    They are friends of the same age. Nobody is the butt of a joke, nobody is
    excluded, and every problem is solved together.
  # The cast, by name. Used to tell a character from a place in a reference
  # filename (benny-lila-playroom.png), and to check that the writer only puts
  # characters in a shot that actually exist.
  cast: [Benny, Lila, Milo, Pip, Luna, Bobo]
  language: "en-US"
  audience: "children aged two to six, and the parents watching with them"
  tone: "warm, calm, encouraging, never scary, never sarcastic"
  banned_topics:
    - "anything frightening: darkness, danger, monsters as threats, getting lost alone"
    - "conflict between characters, teasing, exclusion"
    - "illness, injury, death, hospitals"
    - "brands, money, advertising"
    - "real people, real places by name"

longform:
  enabled: true
  target_seconds: 240          # ~4 minutes of narration
  aspect_ratio: "16:9"
  # The spelling the LTX API accepts here is model-specific and not obvious;
  # `probe --discover` reports which values it takes. Higher tiers cost
  # proportionally more per second.
  resolution: "1080p"

shorts:
  enabled: true
  target_seconds: 50           # keep under 60s to qualify as a Short
  aspect_ratio: "9:16"
  # crop       -> reuse the 16:9 clips, centre-cropped (free)
  # regenerate -> ask LTX for dedicated vertical clips (costs extra)
  clip_strategy: "crop"
  max_clips: 6

video:
  provider: "ltx"              # ltx | fal
  model: "ltx-2-3-fast"        # ltx-2-fast / ltx-2-pro were retired 2026-08-15
  clip_seconds: 8
  max_clips: 12                # long-form B-roll clip count (12 x 8s = $3.84 at fast/1080p)
  # How long each clip holds the screen before cutting to the next one.
  segment_seconds: 11

  # Looping a clip forward-then-backward is invisible on atmospheric B-roll and
  # is what keeps the documentary mode affordable. On a story it is not: a
  # character walks backwards halfway through the shot. Turn it off for
  # animation and every second on screen is generated once, at full price.
  reuse_clips: false

  # text -> text-to-video, a fresh subject every call
  # image -> image-to-video from a reference still, which is the only way to
  #          keep the same character across shots and across videos
  generation: "image"
  # The stills each shot is animated from. These become first frames, so they
  # must look like frames of the show — characters in a real place, not on a
  # white background. The character sheets in assets/characters are reference
  # material for making these, and are never sent to the API.
  frame_dir: "assets/frames"
  transition_seconds: 0.5      # 0 disables cross-fades and uses hard cuts
  concurrency: 3               # how many clips to generate at once
  # LTX can generate audio with each shot. It is ambient rather than dialogue —
  # footsteps, birds, a door — and mixed low it is free sound design, since the
  # video is billed by duration either way. Worth testing on the pilot; turn it
  # off if it fights the voices.
  generate_audio: false
  generated_audio_db: -22      # how far under the dialogue it sits
  fps: 25
  # Appended to every shot prompt so the whole video looks like one piece.
  style_suffix: "cinematic documentary footage, natural lighting, shallow depth of field, muted film colour grade, slow deliberate camera movement, no text, no watermark, no readable faces in close-up"
  negative_prompt: "text, captions, watermark, logo, distorted hands, extra limbs, low quality, jitter"

voice:
  # edge       -> free, and the reason the first pilot sounded robotic. It is
  #               Microsoft's browser read-aloud service: no expression control
  #               of any kind, so excited, worried and sad all land identically.
  #               Shifting pitch to tell characters apart makes it worse, not
  #               better — a neural voice bent away from its natural range
  #               sounds synthetic. Fine for checking pacing, wrong for publishing.
  # elevenlabs -> a real voice per character and expression that carries. About
  #               $0.90 an episode against $15 for the same episode's video, so
  #               roughly six per cent of the cost for most of the perceived
  #               quality. This is the one to publish with.
  # silent     -> no audio at all, for rehearsing the pipeline free.
  provider: "edge"

  # Free fallback. Deliberately mild pitch shifts: large ones separate the
  # characters at the cost of making all of them sound artificial.
  cast:
    Benny:    { voice: "en-US-AnaNeural",   rate: "+8%",  pitch: "+6Hz" }
    Lila:     { voice: "en-US-AnaNeural",   rate: "+0%",  pitch: "+0Hz" }
    Luna:     { voice: "en-US-MichelleNeural", rate: "+6%", pitch: "+8Hz" }
    Pip:      { voice: "en-US-AnaNeural",   rate: "-4%",  pitch: "+14Hz" }
    Bobo:     { voice: "en-US-GuyNeural",   rate: "-8%",  pitch: "-6Hz" }
    Milo:     { voice: "en-US-AnaNeural",   rate: "+14%", pitch: "+10Hz" }
    Narrator: { voice: "en-US-JennyNeural", rate: "+0%",  pitch: "+0Hz" }

  # One ElevenLabs voice id per character, used when provider is elevenlabs.
  # Pick them from the ElevenLabs voice library — search for child voices and
  # audition them there before pasting the ids in. Six real voices is the whole
  # point; do not reuse one id for several characters.
  elevenlabs_cast: {}
    # Benny: "voice_id_here"
    # Lila:  "voice_id_here"
  # eleven_v3 is the model that understands audio tags — the [excited] and
  # [worried] markers built from each line's emotion. Older models do not:
  # they either ignore the tag or read it out loud, which is worse than having
  # no emotion at all. Do not downgrade this without removing the tags.
  elevenlabs_model: "eleven_v3"
  elevenlabs_voice_id: ""      # fallback for a speaker with no id above
  # Passed through untouched when set. Left empty so the model's own defaults
  # apply, which is the safer starting point.
  elevenlabs_settings: {}

  default_voice: "en-US-AnaNeural"
  default_rate: "+4%"
  default_pitch: "+0Hz"

  # Silence between lines. A beat after a question is where a child answers.
  gap_seconds: 0.28
  question_gap_seconds: 0.75

captions:
  enabled_longform: false      # long-form relies on YouTube's own captions
  enabled_shorts: true         # burned-in captions are near-mandatory for Shorts
  font: "DejaVu Sans"
  font_size_shorts: 78
  font_size_longform: 54
  primary_colour: "&H00FFFFFF"     # ASS colours are &HAABBGGRR
  highlight_colour: "&H0000E5FF"   # amber, used on the active word
  outline: 4
  margin_v: 260                # Shorts: distance from the bottom edge, in px
  margin_v_longform: 90

music:
  enabled: true
  # Drop your own royalty-free tracks here; the run picks one at random.
  directory: "assets/music"
  volume_db: -26               # music sits well under the narration
  fade_seconds: 2.5

publish:
  timezone: "Europe/Istanbul"
  # The fixed daily wall-clock publish time. The render can finish whenever;
  # YouTube flips the video public at exactly this moment.
  publish_at_local: "19:00"
  # Shorts go out at a different slot so the two never compete with each other.
  shorts_publish_at_local: "12:00"
  # 27 = Education, 28 = Science & Technology, 24 = Entertainment,
  # 1 = Film & Animation
  category_id: "1"
  # Required by COPPA for content aimed at children. Setting it turns off
  # personalised ads, comments, notifications, end screens and cards. It is a
  # legal declaration, not a preference — do not set it false to keep the ads.
  made_for_kids: true
  default_tags:
    - "documentary"
    - "explained"
    - "history of technology"

budget:
  # Hard ceiling per run. The run aborts before spending anything if the
  # estimate exceeds it.
  #
  # At the measured $0.06/s with reuse_clips off, one episode plus its short
  # costs roughly:
  #     3 min  ->  $15
  #     4 min  ->  $19
  #     5 min  ->  $23
  # So $25 admits any of those and still stops a runaway — a shot count that
  # doubles by mistake, or a resolution change nobody meant to make.
  #
  # This is a spending decision, not a technical one. Lower it if you want a
  # tighter leash; the run will tell you exactly what it would have cost.
  max_usd_per_run: 25.00
  # Per-second LTX prices, USD.
  #
  # ltx-2-3-fast is MEASURED, not guessed: one 8s 1920x1080 clip billed $0.48
  # on 2026-08-22, which is $0.06/s. Every earlier figure in this file was
  # wrong in both directions — $0.04 from a third-party listing, $0.13 from a
  # listing for a different model generation.
  #
  # The others remain unverified. Read your own invoice before trusting them,
  # and correct them here: the budget ceiling is only as honest as this table.
  #
  # Also confirmed by that invoice: rejected requests are not billed. The
  # discovery sweep made dozens of them and exactly one appeared.
  ltx_price_per_second:
    ltx-2-3-fast: 0.06      # measured 2026-08-22
    ltx-2-3-pro: 0.09       # unverified, scaled from the fast rate
    ltx-2-5-fast: 0.13      # unverified
    ltx-2-5-pro: 0.19       # unverified

state:
  # Rolling memory so the ideation step never repeats itself.
  history_file: "state/history.json"
  dedupe_last_n: 120
