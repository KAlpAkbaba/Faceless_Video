# Editorial plan.
#
# The pipeline works through publish_order, skipping anything already recorded
# in state/history.json. When the list runs out it falls back to inventing a
# topic, so the queue can be extended at any time without touching code.
#
# hook is the first thing said, before any greeting or logo: the problem lands
# in the first two seconds or the viewer is gone.
# thumbnail describes ONE readable moment - two characters at most, one object,
# one strong feeling. Preschoolers cannot read, so the picture carries it.
publish_order:
