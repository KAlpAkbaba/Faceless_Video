name: Daily video

on:
  schedule:
    # 12:00 UTC. Give the render a wide margin ahead of the publish slot in
    # config.yaml — the upload is scheduled, so finishing early is free.
    # GitHub's scheduler is best-effort and can run late under load.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Which cuts to build"
        type: choice
        options: [both, longform, shorts]
        default: both
      upload:
        description: "Publish to YouTube"
        type: boolean
        default: true
      keep_videos:
        description: "Attach the rendered files as workflow artifacts"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Never let two runs publish on the same day or race on state/history.json.
  group: daily-video
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          ffmpeg -version | head -1

      - name: Install Python dependencies
        run: pip install --disable-pip-version-check -q -r requirements.txt

      - name: Check configuration and credentials
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LTX_API_KEY: ${{ secrets.LTX_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m pipeline.cli doctor

      - name: Show the cost estimate
        run: python -m pipeline.cli plan

      - name: Build and publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LTX_API_KEY: ${{ secrets.LTX_API_KEY }}
          LTX_API_BASE: ${{ vars.LTX_API_BASE }}
          LTX_SUBMIT_PATH: ${{ vars.LTX_SUBMIT_PATH }}
          LTX_STATUS_PATH: ${{ vars.LTX_STATUS_PATH }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Decided in the shell, not in a GitHub expression: on a scheduled
          # run `inputs.*` is null, and `null == false` is TRUE in expression
          # syntax — which would silently stop the daily run from publishing.
          ONLY: ${{ inputs.only }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          ARGS=()
          if [ "$UPLOAD" = "false" ]; then ARGS+=(--no-upload); fi
          python -m pipeline.cli run --only "${ONLY:-both}" "${ARGS[@]}"

      - name: Record the published topic
        # Runs even when the build failed, so a half-finished topic is not
        # silently retried tomorrow with a different angle.
        if: always()
        run: |
          if [[ -z "$(git status --porcelain state/)" ]]; then
            echo "No history change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "chore: record published topic $(date -u +%Y-%m-%d)"
          # Another run may have pushed while this one rendered.
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 4))
          done
          echo "::error::Could not push the updated history after 4 attempts."
          exit 1

      - name: Upload scripts and thumbnails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-metadata
          retention-days: 14
          if-no-files-found: ignore
          path: |
            work/**/topic.json
            work/**/scripts.json
            out/**/*.jpg

      - name: Upload rendered videos
        if: always() && inputs.keep_videos
        uses: actions/upload-artifact@v4
        with:
          name: rendered-videos
          retention-days: 3
          if-no-files-found: ignore
          path: out/**/*.mp4
